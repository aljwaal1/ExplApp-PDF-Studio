name: Build ExplApp PDF Studio APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'core/**'
      - 'modules/**'
      - 'ui/**'
      - 'excel-tool.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-android.mjs'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK available at $ANDROID_HOME"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare web assets
        run: npm run android:prepare
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ExplApp-PDF-Studio-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ExplApp-PDF-Studio-APK
          path: ExplApp-PDF-Studio-Android.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${{ github.run_number }}"
          gh release create "$tag" ExplApp-PDF-Studio-Android.apk --title "ExplApp PDF Studio Android Build ${{ github.run_number }}" --notes "Installable Android debug-signed APK built from the same web source as the PWA. External PDF libraries and OCR language downloads may require internet. Test on a physical Android device before wider distribution."
