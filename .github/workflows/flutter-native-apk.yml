name: Build Flutter Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_native/**'
      - '.github/workflows/flutter-native-apk.yml'
  pull_request:
    paths:
      - 'flutter_native/**'
      - '.github/workflows/flutter-native-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate native Android project
        run: flutter create --platforms android --org com.explapp --project-name explapp_pdf_studio .
      - name: Configure PDFBox for Android
        run: |
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/explapp/explapp_pdf_studio/MainActivity.kt
          printf '\n// Native offline PDF engine\ndependencies {\n    implementation("com.tom-roush:pdfbox-android:2.0.27.0")\n    implementation("cz.adaptech.tesseract4android:tesseract4android:4.9.0")\n}\n' >> android/app/build.gradle.kts
      - name: Configure JitPack OCR dependency
        run: |
          sed -i '/mavenCentral()/a\\        maven(url = "https://jitpack.io")' android/settings.gradle.kts
      - name: Bundle offline OCR language models
        run: |
          mkdir -p android/app/src/main/assets/tessdata
          for lang in ara eng; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${lang}.traineddata" \
              -o "android/app/src/main/assets/tessdata/${lang}.traineddata"
            test -s "android/app/src/main/assets/tessdata/${lang}.traineddata"
          done
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter widget tests
        run: flutter test
      - name: Build Android APK
        run: |
          for attempt in 1 2; do
            if flutter build apk --debug; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "Retrying after a transient Android SDK/NDK download failure..."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
            sleep 8
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ExplApp-Flutter-Native-APK
          path: flutter_native/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - name: Publish native Android release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="flutter-native-${{ github.run_number }}"
          gh release create "$tag" build/app/outputs/flutter-apk/app-debug.apk --title "ExplApp PDF Studio Flutter Native ${{ github.run_number }}" --notes "Flutter/Dart native UI, Kotlin + Android PDFBox for offline merge, extract and rotate. Debug test build; more tools will follow."
